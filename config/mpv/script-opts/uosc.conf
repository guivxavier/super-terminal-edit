timeline_style=line
timeline_line_width=2
timeline_size=24
progress=windowed
progress_size=2
top_bar=never
controls=space,stream-quality,fullscreen
stream_quality_options=2160,1440,1080,720,480,360
volume=right
color=foreground=E06C75,foreground_text=282C34,background=21252B,background_text=ABB2BF
font_scale=1.1
# como no YouTube: a mexer o rato em cima do video (em qualquer sitio, nao so perto da barra) os controlos aparecem;
# com o rato parado ~1 s, ou fora da janela, escondem-se (tambem em ecra inteiro)
proximity_in=4000
proximity_out=4100
autohide=yes
# a direita da barra: a duracao do video (como no YouTube), nao o tempo que falta
destination_time=total
# barra de tempo limpa: sem o grafico "mais vistos" do YouTube, sem as riscas da parte por carregar, sem moldura;
# fundo e marcas de capitulos discretos
timeline_heatmap=no
timeline_cache=no
timeline_border=0
opacity=timeline=0.55,chapters=0.45,position=1
