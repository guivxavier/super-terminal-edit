# teclas do mpv no st (o terminal passa-lhe as teclas; os menus do uosc apanham-nas primeiro quando estão abertos)
ESC        quit
q          quit
SPACE      cycle pause
LEFT       seek -10
RIGHT      seek 10
UP         add volume 5
DOWN       add volume -5
m          cycle mute
f          cycle fullscreen
s          script-binding uosc/subtitles
a          script-binding uosc/audio
c          script-binding uosc/chapters
MBTN_RIGHT script-binding uosc/menu
MBTN_LEFT cycle pause   # clicar no video = pausa / continua
